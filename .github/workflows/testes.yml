name: Testes

# Roda a suite em todo envio de ramo (nao publica nada). A publicacao para a
# fabrica fica no release.yml, que roda a mesma suite antes de criar a release.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: python -m pip install -r requirements.txt pytest

      - name: Testes
        run: python -m pytest tests/ -q -p no:cacheprovider
